<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".78"
        numOctaves="3"
        seed="23"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".42" intercept=".29"/>
        <feFuncG type="linear" slope=".4" intercept=".3"/>
        <feFuncB type="linear" slope=".36" intercept=".32"/>
        <feFuncA type="linear" slope=".34"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="320" height="320" filter="url(#paper-grain)"/>
</svg>
